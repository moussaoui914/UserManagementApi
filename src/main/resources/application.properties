# ===== DataSource H2 =====
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
db.username=sa
db.password=

# ===== HikariCP =====
db.pool.name=UserMgmtPool
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeout=30000

# ===== JPA / Hibernate =====
jpa.dialect=org.hibernate.dialect.H2Dialect
jpa.showSql=true
jpa.formatSql=true
jpa.hbm2ddl.auto=update
jpa.packagesToScan=com.example.usermanagement.entity